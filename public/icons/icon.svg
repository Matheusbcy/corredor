<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="paceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E00" />
      <stop offset="50%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FF5E00" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#0B0F19"/>
  
  <!-- Outer subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1E293B" stroke-width="8"/>
  
  <!-- Speed lines -->
  <path d="M120 180 L200 180" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M90 256 L180 256" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <path d="M130 332 L220 332" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Runner Silhouette Dynamic -->
  <g filter="url(#glow)">
    <!-- Head -->
    <circle cx="340" cy="140" r="32" fill="url(#paceGrad)"/>
    
    <!-- Torso & Arms & Legs -->
    <path d="M 320 180 
             C 300 210, 280 230, 260 260 
             L 210 240 
             L 170 290 
             M 260 260 
             L 300 330 
             L 360 350 
             M 320 200 
             L 370 220 
             L 420 190
             M 285 240
             L 240 340
             L 180 390" 
          stroke="url(#paceGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
</svg>